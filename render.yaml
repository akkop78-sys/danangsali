services:
  - type: web
    name: danangsali
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn shop:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PAYMENT_MODE
        value: bank
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: danangsali123
      - key: PYTHON_VERSION
        value: "3.9.18"
