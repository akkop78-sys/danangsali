{% extends "admin/base_admin.html" %}

{% block title %}마케팅 복붙 — {{ shop_name }}{% endblock %}

{% block content %}
<div class="section-head">
  <h2>마케팅 복붙 문구</h2>
  <p>네이버 블로그·카페·단톡에 그대로 복사해 쓰세요. 링크는 사이트 주소로 바꿔 넣으면 됩니다.</p>
</div>

{% for post in posts %}
  <article class="order-block">
    <h3>{{ post.title }}</h3>
    <p class="muted">추천 채널: {{ post.channel }}</p>
    <label>
      제목
      <input type="text" readonly value="{{ post.title }}" onclick="this.select()" />
    </label>
    <label>
      본문 (클릭 후 Ctrl+A → 복사)
      <textarea rows="12" readonly onclick="this.select()">{{ post.body }}</textarea>
    </label>
  </article>
{% endfor %}
{% endblock %}
