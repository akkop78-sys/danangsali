<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 로그인 — {{ shop_name }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="admin-body">
  <div class="page-bg" aria-hidden="true"></div>
  <section class="auth-page">
    <div class="section-head">
      <h2>{{ shop_name }} 관리자</h2>
      <p>아이디 <strong>admin</strong> / 비밀번호 <strong>danangsali123</strong></p>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-wrap" style="padding:0;margin-bottom:1rem">
          {% for category, message in messages %}
            <p class="flash flash-{{ category }}">{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    <form class="auth-form" method="post">
      <label>
        아이디
        <input type="text" name="username" value="admin" required />
      </label>
      <label>
        비밀번호
        <input type="password" name="password" required />
      </label>
      <button class="btn btn-primary" type="submit">로그인</button>
    </form>
    <p class="auth-switch"><a href="{{ url_for('index') }}">← 쇼핑몰로 돌아가기</a></p>
  </section>
</body>
</html>
